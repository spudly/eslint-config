# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'en-US'
reviews:
  # Automatic Approvals: CodeRabbit approves a PR once its review of the latest
  # commit is clean, its threads are resolved, and its pre-merge checks pass.
  # The repo's branch rules require 1 approval before merge; this lets a clean
  # CodeRabbit review satisfy it.
  auto_approvals:
    enabled: true
  path_instructions:
    - path: 'packages/eslint-config/src/**'
      instructions: |
        This repo is @spudly/eslint-config, a shared ESLint 10 flat config
        consumed by the other Spudly repos. Review against these conventions:
        - The public export list stays small on purpose: base, react,
          reactNative, jest, tailwind, typescriptPendingIgnores, node
          (src/index.ts). Flag new top-level exports for rule groups that
          belong inside base — import-x, unicorn, the CommonJS overrides, and
          the coverage-ignore rule already fold into base.
        - Flag `files:` globs or other directory-layout scoping added to
          config blocks in this package. Rule groups that need directory
          scoping ship as rules-only exports; each consuming repo attaches
          its own `files:` globs. Scoping intrinsic to a rule itself
          (extension/language matching) may stay.
        - Flag any attempt to add a "no className outside components" rule
          (or a similar className/style-prop restriction) here; that rule
          lives in the design-system repo, not in the shared config.
        - typescript-eslint and the @eslint-react chain stay disabled until
          they support TypeScript 7. Flag PRs that re-enable them in active
          exports.
        - reactPending (src/react-pending.ts) is a subpath-only export
          (@spudly/eslint-config/react-pending). Flag any change anywhere
          under src/** — including a re-export from src/index.ts — that
          re-exports it from the package root or folds it into react or
          another active export, because that re-breaks root imports under
          TypeScript 7. Exception: the documented restoration, once a
          TypeScript 7-compatible @eslint-react release is proven by the
          TS7 consumer fixture (packages/eslint-config/test/ts7Consumer.test.mjs), may fold it
          into react.
        - Any new or modified rule intentionally set to 'off' must carry a
          rationale comment; flag unexplained 'off' entries in changed code.
          Deprecated/removed and new/missing
          rules are audited by `npm run check-rules`
          (packages/eslint-config/scripts/checkRules.mjs).
        - TypeScript style: use type aliases, never interfaces, outside
          vendored code under src/react-native-plugin/ (upstream-owned).
    - path: 'packages/eslint-config/src/react-pending.ts'
      instructions: |
        This file preserves the @eslint-react rules in the reactPending
        export while @eslint-react lacks TypeScript 7 support. It is a
        subpath-only export (@spudly/eslint-config/react-pending): while
        the hold lasts it must not be re-exported from src/index.ts or
        folded into react. Flag any edit that alters the preserved rule set
        or moves these rules into an active export — except audit-driven
        currency updates from the check-rules script (deprecated removals,
        explicit entries for new rules), which are required maintenance,
        and the documented restoration into react once a TypeScript
        7-compatible @eslint-react release is proven by the TS7 consumer
        fixture.
    - path: 'packages/eslint-config/package.json'
      instructions: |
        The exports map stays small: ., ./base, ./jest, ./node, ./react,
        ./react-pending, ./react-native, ./tailwind, ./typescript. Removing
        ./react-pending is allowed only as part of the documented
        restoration, once a TypeScript 7-compatible @eslint-react release
        is proven by the TS7 consumer fixture. Flag new subpath exports
        for rule groups that belong in base. The packageManager field pins
        npm@10.9.4; flag changes to it.
    - path: 'package-lock.json'
      instructions: |
        This file is never hand-edited; it is regenerated with the pinned
        npm (npm@10.9.4, the packageManager field in package.json). Flag
        lockfile changes that look hand-edited or that are inconsistent with
        the dependency changes in package.json.
