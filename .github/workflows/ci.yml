name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  push:
    branches: [main]
  # No `edited` type: PR-body edits re-run only the merge-guard
  # workflow (merge-guard.yml), not this build.
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default (#23): no job receives any GITHUB_TOKEN scope
# unless it declares what it needs. The ci job declares contents read
# below; ci-gate calls no API and needs none. release.yml and
# merge-guard.yml are separate workflows and declare the scopes
# they need there.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required by actions/checkout
      # No packages scope: npm ci installs only public npmjs dependencies
      # (the lockfile has no GitHub Packages resolutions and no @spudly/*
      # dependencies), so no package read is needed.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@spudly'
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check-drift
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run prettier:check

  # Knip dead-code detection in WARN MODE (#47, Phase 1): findings are
  # reported as annotations and in the job summary, but the step always
  # exits 0, this job is NOT in ci-gate's needs, and it is NOT a required
  # status check — pre-existing dead code must never block a PR in this
  # phase. Phase 3 (enforce) flips the always-zero exit once the
  # baseline is burned down.
  knip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@spudly'
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Knip (warn mode — never fails this phase)
        run: |
          set +e
          npm run knip -- --reporter github-actions 2>&1 | tee knip-report.txt
          code=${PIPESTATUS[0]}
          {
            echo "## Knip baseline (warn mode, #47 Phase 1)"
            echo ""
            echo "Raw knip exit code: $code (findings are expected in Phase 1; this job never fails)."
            echo ""
            echo '```'
            cat knip-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # jscpd copy-paste detection in WARN MODE (#48, Phase 1): findings are
  # reported in the job summary, but the step always exits 0, this job is
  # NOT in ci-gate's needs, and it is NOT a required status check —
  # pre-existing duplication must never block a PR in this phase. Phase 3
  # (enforce) sets a threshold in .jscpd.json and flips the always-zero
  # exit once Stephen agrees the threshold.
  # Scan scope (.jscpd.json): packages/eslint-config/src only, excluding the
  # vendored packages/eslint-config/src/react-native-plugin/** —
  # temporary vendored code with its own upstream, deleted wholesale
  # when #5 lands; the pre-monorepo baseline run including it found
  # all 4 clones (48 duplicated lines, 1.14%) inside it, and 0 clones
  # on the scanned surface.
  jscpd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required by actions/checkout
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@spudly'
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: jscpd (warn mode — never fails this phase)
        run: |
          set +e
          npm run jscpd 2>&1 | tee jscpd-report.txt
          code=${PIPESTATUS[0]}
          {
            echo "## jscpd baseline (warn mode, #48 Phase 1)"
            echo ""
            echo "Raw jscpd exit code: $code (findings are expected in Phase 1; this job never fails)."
            echo ""
            echo '```'
            cat jscpd-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Always-reporting gate for branch protection: needs every job in
  # this workflow and reports whenever the workflow runs. It fails
  # only when a needed job failed or was cancelled, and passes when
  # the rest succeeded or were legitimately skipped. Note: this does
  # not make the gate appear on Version Packages PRs — those are
  # created by the changesets action with the default GITHUB_TOKEN,
  # and GitHub does not start workflow runs for token-created PRs at
  # all (see the PR description).
  ci-gate:
    name: ci-gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
