name: ci

on:
  # Push runs only on main: a feature-branch push that also has an open PR
  # otherwise runs CI twice for the same commit (push + pull_request).
  push:
    branches: [main]
  # `edited` is included so that editing the PR body (for example
  # ticking a checklist checkbox) re-runs this workflow: the
  # merge-guard below must re-check the body when it changes.
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least-privilege default (#23): no job receives any GITHUB_TOKEN scope
# unless it declares what it needs. The ci job declares contents +
# packages read below; merge-guard declares its own pull-requests read;
# ci-gate calls no API and needs none. release.yml is a separate
# workflow and declares the write scopes it needs there.
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@spudly'
      - name: Enable Corepack (pinned npm)
        run: corepack enable npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run lint
      - run: npm run prettier:check

  # Fails when the PR body still contains unchecked task-list
  # items, so the PR template's pre-merge checklist is enforced
  # rather than advisory. An item counts as waived when it is
  # struck through (the template's "struck through with a reason"
  # convention). Dependabot PRs are exempt: their bodies quote
  # upstream changelogs, which can contain task lists we did not
  # author. The `edited` trigger above re-runs this job when the
  # body changes, so ticking the last box turns the gate green.
  merge-guard:
    name: merge-guard
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Fetch PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
      - name: Check for unchecked task-list items
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const body = fs.readFileSync(
            process.env.RUNNER_TEMP + '/pr-body.md',
            'utf8',
          );
          // Task-list syntax inside HTML comments is documentation,
          // not a task: strip comments before scanning.
          const uncommented = body.replace(/<!--[\s\S]*?-->/g, '');
          // Lines inside fenced code blocks are quoted examples,
          // not tasks either: skip them. A fence only closes with
          // the marker that opened it (a ~~~ line inside a ```
          // block is content, not a fence).
          const open = [];
          let fenceMarker = null;
          for (const line of uncommented.split('\n')) {
            const fence = line.match(/^\s*(```|~~~)/);
            if (fence) {
              if (fenceMarker === null) fenceMarker = fence[1];
              else if (fence[1] === fenceMarker) fenceMarker = null;
              continue;
            }
            if (fenceMarker !== null) continue;
            if (
              /^\s*[-*+]\s+\[\s\]\s+\S/.test(line) &&
              !line.includes('~~')
            ) {
              open.push(line.trim());
            }
          }
          if (open.length > 0) {
            console.log(
              'Unchecked task-list items remain in the PR body:',
            );
            for (const item of open) console.log('  ' + item);
            console.log(
              'Check each item off, or strike it through with a reason, before merging.',
            );
            process.exit(1);
          }
          console.log(
            'All task-list items in the PR body are complete or waived.',
          );
          EOF

  # Always-reporting gate for branch protection: needs every job in
  # this workflow and reports whenever the workflow runs. It fails
  # only when a needed job failed or was cancelled, and passes when
  # the rest succeeded or were legitimately skipped. Note: this does
  # not make the gate appear on Version Packages PRs — those are
  # created by the changesets action with the default GITHUB_TOKEN,
  # and GitHub does not start workflow runs for token-created PRs at
  # all (see the PR description).
  ci-gate:
    name: ci-gate
    needs: [ci, merge-guard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS_JSON" | jq -e '[.[] | .result] | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::A job this gate depends on failed or was cancelled."
            exit 1
          fi
